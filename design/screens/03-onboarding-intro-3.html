<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>odit. · 앱 소개 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #F4EFFC; font-family: 'Noto Sans KR', sans-serif; color: #241B33; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; justify-content: flex-end; padding: 20px 16px 0; height: 40px">
    <button style="border: 0; background: transparent; padding: 8px 4px; font-size: 14px; font-weight: 500; color: #645A73">건너뛰기</button>
  </header>
  <div style="position: relative; margin: 16px 16px 0; height: 380px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%)">
    <div style="position: absolute; inset: 0; padding: 24px 20px; box-sizing: border-box; display: flex; flex-direction: column">
      <div style="font-size: 12px; color: #645A73">저장한 사진 · 출근룩</div>
      <div style="margin-top: 2px; font-size: 16px; font-weight: 800">카디건만 있으면 완성</div>
      <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <div><div style="height: 112px; background: #E7DFF5"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">슬랙스</div><div style="font-size: 11px; color: #645A73">차콜 · 가진 옷</div></div><div><div style="height: 112px; background: #DFD5F0"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">로퍼</div><div style="font-size: 11px; color: #645A73">블랙 · 가진 옷</div></div><div><div style="height: 112px; box-sizing: border-box; border: 1.5px dashed #9B7BE0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #4A2D99">필요</div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">카디건</div><div style="font-size: 11px; color: #645A73">아이보리</div></div>
      </div>
      <button style="height: 40px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(46, 26, 92, 0.12); font-size: 14px; font-weight: 700; color: #6A3FC4; margin-top: auto; width: 100%">비슷한 카디건 찾기</button>
    </div>
  </div>
  <div style="padding: 32px 24px 0">
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.35">있는 옷으로 입고,<br>필요한 것만 찾아요</h1>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #645A73">가진 옷으로 되는 코디를 먼저 보여 주고, 없는 옷은 비슷한 상품을 찾아 줘요.</p>
  </div>
  <div style="margin-top: auto; padding: 0 16px 24px">
    <div style="display: flex; justify-content: center; gap: 6px; margin-bottom: 20px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #D9CCF0"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #D9CCF0"></span><span style="width: 18px; height: 6px; border-radius: 999px; background: #9B7BE0"></span></div>
    <button style="width: 100%; height: 54px; flex-shrink: 0; border: 0; border-radius: 14px; background: #CDB8F4; color: #2E1A5C; font-size: 16px; font-weight: 700">시작하기</button>
  </div>
</div>
</body>
</html>
