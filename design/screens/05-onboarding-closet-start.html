<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>odit. · 옷장 시작하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #F4EFFC; font-family: 'Noto Sans KR', sans-serif; color: #241B33; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 24px 16px 0">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px"><div style="height: 4px; border-radius: 999px; background: #9B7BE0"></div><div style="height: 4px; border-radius: 999px; background: #9B7BE0"></div></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin-top: 6px; font-size: 12px"><span style="color: #645A73">1 추구미</span><span style="font-weight: 700; color: #6A3FC4">2 옷장</span></div>
  </div>
  <h1 style="margin: 22px 20px 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.4">옷장에 5벌만<br>먼저 넣어 볼까요?</h1>
  <p style="margin: 6px 20px 0; font-size: 14px; line-height: 1.55; color: #645A73">가진 옷이 있어야 저장한 코디와 맞춰 볼 수 있어요</p>
  <div style="margin: 16px 16px 0; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%)">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 14px; font-weight: 700">지금 옷장</span>
      <span style="font-size: 14px; color: #645A73"><b style="font-size: 20px; color: #6A3FC4">2</b> / 5벌</span>
    </div>
    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px"><div style="height: 6px; border-radius: 999px; background: #9B7BE0"></div><div style="height: 6px; border-radius: 999px; background: #9B7BE0"></div><div style="height: 6px; border-radius: 999px; background: #E3D9F3"></div><div style="height: 6px; border-radius: 999px; background: #E3D9F3"></div><div style="height: 6px; border-radius: 999px; background: #E3D9F3"></div></div>
  </div>
  <p style="margin: 18px 20px 10px; font-size: 14px; font-weight: 700">자주 있는 옷 — 누르면 바로 들어가요</p>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 16px">
      <button style="padding: 8px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); text-align: left; color: #241B33"><span style="height: 64px; background: #EDE6F8; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #645A73">그림</span><span style="display: block; margin: 8px 2px 0; font-size: 12px; font-weight: 700">셔츠</span><span style="display: block; margin: 1px 2px 0; font-size: 11px; color: #645A73">화이트 · 레귤러</span></button>
      <button aria-pressed="true" style="position: relative; padding: 7px; border: 2px solid #9B7BE0; background: #FFFFFF; box-shadow: 0 6px 20px rgba(46, 26, 92, 0.12); text-align: left; color: #241B33"><span style="height: 64px; background: #EDE6F8; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #645A73">그림</span><span style="display: block; margin: 8px 2px 0; font-size: 12px; font-weight: 700; color: #6A3FC4">데님팬츠</span><span style="display: block; margin: 1px 2px 0; font-size: 11px; color: #645A73">중청 · 일자</span><svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true" style="position: absolute; top: 4px; right: 4px"><rect width="26" height="26" rx="8" fill="#CDB8F4"></rect><path d="M8 13.5l3.3 3.2L18 10" fill="none" stroke="#2E1A5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button style="padding: 8px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); text-align: left; color: #241B33"><span style="height: 64px; background: #EDE6F8; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #645A73">그림</span><span style="display: block; margin: 8px 2px 0; font-size: 12px; font-weight: 700">슬랙스</span><span style="display: block; margin: 1px 2px 0; font-size: 11px; color: #645A73">블랙 · 와이드</span></button>
      <button aria-pressed="true" style="position: relative; padding: 7px; border: 2px solid #9B7BE0; background: #FFFFFF; box-shadow: 0 6px 20px rgba(46, 26, 92, 0.12); text-align: left; color: #241B33"><span style="height: 64px; background: #EDE6F8; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #645A73">그림</span><span style="display: block; margin: 8px 2px 0; font-size: 12px; font-weight: 700; color: #6A3FC4">니트</span><span style="display: block; margin: 1px 2px 0; font-size: 11px; color: #645A73">블랙 · 오버사이즈</span><svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true" style="position: absolute; top: 4px; right: 4px"><rect width="26" height="26" rx="8" fill="#CDB8F4"></rect><path d="M8 13.5l3.3 3.2L18 10" fill="none" stroke="#2E1A5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button style="padding: 8px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); text-align: left; color: #241B33"><span style="height: 64px; background: #EDE6F8; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #645A73">그림</span><span style="display: block; margin: 8px 2px 0; font-size: 12px; font-weight: 700">스니커즈</span><span style="display: block; margin: 1px 2px 0; font-size: 11px; color: #645A73">화이트</span></button>
      <button style="padding: 8px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); text-align: left; color: #241B33"><span style="height: 64px; background: #EDE6F8; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #645A73">그림</span><span style="display: block; margin: 8px 2px 0; font-size: 12px; font-weight: 700">트렌치코트</span><span style="display: block; margin: 1px 2px 0; font-size: 11px; color: #645A73">베이지 · 레귤러</span></button>
  </div>
  <div style="padding: 10px 16px 0">
    <button style="height: 40px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(46, 26, 92, 0.12); font-size: 14px; font-weight: 700; color: #6A3FC4; width: 100%">+ 직접 골라 넣기</button>
  </div>
  <div style="margin-top: auto; padding: 0 16px 16px">
    <button style="width: 100%; height: 54px; flex-shrink: 0; border: 0; border-radius: 14px; background: #CDB8F4; color: #2E1A5C; font-size: 16px; font-weight: 700">옷장에 넣고 시작하기</button>
    <button style="width: 100%; height: 44px; border: 0; background: transparent; color: #645A73; font-size: 15px; font-weight: 500; margin-top: 4px">나중에 할게요</button>
  </div>
</div>
</body>
</html>
