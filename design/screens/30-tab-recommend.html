<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>odit. · 추천 탭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFFC; font-family: 'Noto Sans KR', sans-serif; color: #241B33; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 28px 16px 14px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px">추천</h1>
    <p style="margin: 4px 0 0; font-size: 13px; color: #645A73">저장한 사진을 내 옷장으로 맞춰 봤어요</p>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 22px">
    <section>
      <h2 style="margin: 0 0 10px; font-size: 16px; font-weight: 700">지금 옷장으로 바로 입기</h2>
      <div style="padding: 14px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%)">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
          <div style="width: 36px; height: 46px; flex-shrink: 0; border-radius: 8px; background: #DFD5F0"></div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 12px; color: #645A73">저장한 사진 · 2026 가을</div>
            <div style="margin-top: 2px; font-size: 15px; font-weight: 700">가진 옷 3벌로 완성</div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><div><div style="height: 96px; background: #E7DFF5"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">트렌치코트</div><div style="font-size: 11px; color: #645A73">베이지</div></div><div><div style="height: 96px; background: #DFD5F0"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">니트</div><div style="font-size: 11px; color: #645A73">블랙</div></div><div><div style="height: 96px; background: #E7DFF5"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">데님팬츠</div><div style="font-size: 11px; color: #645A73">중청</div></div></div>
      </div>
    </section>
    <section>
      <h2 style="margin: 0 0 10px; font-size: 16px; font-weight: 700">하나만 사면 완성</h2>
      <div style="padding: 14px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%)">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
          <div style="width: 36px; height: 46px; flex-shrink: 0; border-radius: 8px; background: #DFD5F0"></div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 12px; color: #645A73">저장한 사진 · 출근룩</div>
            <div style="margin-top: 2px; font-size: 15px; font-weight: 700">카디건만 있으면 완성</div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><div><div style="height: 96px; background: #E7DFF5"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">슬랙스</div><div style="font-size: 11px; color: #645A73">차콜</div></div><div><div style="height: 96px; background: #DFD5F0"></div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">로퍼</div><div style="font-size: 11px; color: #645A73">블랙</div></div><div><div style="height: 96px; box-sizing: border-box; border: 1.5px dashed #9B7BE0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #4A2D99">필요</div><div style="margin-top: 6px; font-size: 12px; font-weight: 700">카디건</div><div style="font-size: 11px; color: #645A73">아이보리</div></div></div>
        <button style="margin-top: 12px; width: 100%; height: 40px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(46, 26, 92, 0.12); font-size: 14px; font-weight: 700; color: #6A3FC4">비슷한 카디건 찾기</button>
      </div>
    </section>
  </main>
  <nav aria-label="하단 탭" style="height: 76px; flex-shrink: 0; background: #F4EFFC; border-top: 1px solid #E7DFF5; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
    <button style="width: 64px; height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #645A73; font-size: 11px; font-weight: 500; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg><span>홈</span></button>
    <button style="width: 64px; height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6A3FC4; font-size: 11px; font-weight: 700; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.6L20 9.3l-4.3 3.9 1.2 5.8L12 16.1 7.1 19l1.2-5.8L4 9.3l5.6-.7z"></path></svg><span>추천</span></button>
    <button style="width: 64px; height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #645A73; font-size: 11px; font-weight: 500; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg><span>챗봇</span></button>
    <button style="width: 64px; height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #645A73; font-size: 11px; font-weight: 500; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5a2 2 0 1 1 2 2c-1 .4-2 1-2 2v1"></path><path d="M12 11.5L3.5 17.6c-.7.5-.3 1.4.5 1.4h16c.8 0 1.2-.9.5-1.4L12 11.5z"></path></svg><span>옷장</span></button>
    <button style="width: 64px; height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #645A73; font-size: 11px; font-weight: 500; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg><span>마이</span></button>
  </nav>
</div>
</body>
</html>
