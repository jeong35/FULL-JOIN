<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #F4EFFC; font-family: 'Noto Sans KR', sans-serif; color: #241B33; display: flex; flex-direction: column; overflow: hidden">

    <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 14px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%)">
