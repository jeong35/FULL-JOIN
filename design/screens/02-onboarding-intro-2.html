<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>odit. · 앱 소개 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #F4EFFC; font-family: 'Noto Sans KR', sans-serif; color: #241B33; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; justify-content: flex-end; padding: 20px 16px 0; height: 40px">
    <button style="border: 0; background: transparent; padding: 8px 4px; font-size: 14px; font-weight: 500; color: #645A73">건너뛰기</button>
  </header>
  <div style="position: relative; margin: 16px 16px 0; height: 380px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 2px rgba(46, 26, 92, 0.05), 0 6px 20px rgba(46, 26, 92, 0.07); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%)">
    <div style="position: absolute; inset: 0; padding: 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 6px">
        <div style="width: 64px; height: 84px; flex-shrink: 0; background: #DFD5F0"></div>
        <div><div style="font-size: 12px; color: #645A73">저장한 사진</div><div style="margin-top: 2px; font-size: 16px; font-weight: 800">아이템 3개를 찾았어요</div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.8); box-shadow: 0 4px 14px rgba(46, 26, 92, 0.06)"><div style="width: 36px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #E7DFF5"></div><div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 700">트렌치코트</div><div style="margin-top: 2px; font-size: 11px; color: #645A73">베이지 · 옷장에 같은 색 있음</div></div><span style="flex-shrink: 0; height: 26px; padding: 0 11px; box-sizing: border-box; border-radius: 7px; font-size: 12px; font-weight: 700; display: flex; align-items: center; background: #CDB8F4; color: #2E1A5C">활용</span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.8); box-shadow: 0 4px 14px rgba(46, 26, 92, 0.06)"><div style="width: 36px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #DFD5F0"></div><div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 700">데님팬츠</div><div style="margin-top: 2px; font-size: 11px; color: #645A73">연청 · 옷장에 중청 있음</div></div><span style="flex-shrink: 0; height: 26px; padding: 0 11px; box-sizing: border-box; border-radius: 7px; font-size: 12px; font-weight: 700; display: flex; align-items: center; border: 1px solid #CDB8F4; background: #FFFFFF; color: #4A2D99">비슷함</span></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.8); box-shadow: 0 4px 14px rgba(46, 26, 92, 0.06)"><div style="width: 36px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #E7DFF5"></div><div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 700">카디건</div><div style="margin-top: 2px; font-size: 11px; color: #645A73">아이보리 · 옷장에 없음</div></div><span style="flex-shrink: 0; height: 26px; padding: 0 11px; box-sizing: border-box; border-radius: 7px; font-size: 12px; font-weight: 700; display: flex; align-items: center; border: 1.5px dashed #9B7BE0; color: #4A2D99">필요</span></div>
    </div>
  </div>
  <div style="padding: 32px 24px 0">
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.35">AI가 내 옷장과<br>맞춰 봐요</h1>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #645A73">사진 속 옷을 하나씩 찾아서, 내 옷장에 같은 옷이 있는지 알려 줘요.</p>
  </div>
  <div style="margin-top: auto; padding: 0 16px 24px">
    <div style="display: flex; justify-content: center; gap: 6px; margin-bottom: 20px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #D9CCF0"></span><span style="width: 18px; height: 6px; border-radius: 999px; background: #9B7BE0"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #D9CCF0"></span></div>
    <button style="width: 100%; height: 54px; flex-shrink: 0; border: 0; border-radius: 14px; background: #CDB8F4; color: #2E1A5C; font-size: 16px; font-weight: 700">다음</button>
  </div>
</div>
</body>
</html>
