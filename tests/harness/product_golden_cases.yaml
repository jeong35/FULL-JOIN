      "note": "취향 사진이 3장뿐이어도 이웃·나머지로 이어서 모두 보여 준다. p7은 미니멀이 있어 취향 묶음, 이웃 묶음은 청순(p4) → 시크(p8, p3) 순으로 돌아가며, 필터에는 시크 사진만 최신순으로 나와야 한다. 나머지 묶음(p5)이 이웃 묶음보다 먼저 나오거나 필터에 다른 스타일이 섞이면 실패다."
