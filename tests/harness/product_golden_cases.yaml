          {"kinds": ["데님팬츠", "슬랙스", "코튼팬츠", "조거팬츠"], "fits": ["스키니", "일자", "와이드", "부츠컷"]},
          {"kinds": ["미니스커트", "미디스커트", "롱스커트"], "fits": ["A라인", "H라인", "플레어"]},
          {"kinds": ["숏팬츠", "레깅스", "스니커즈", "로퍼", "플랫슈즈", "힐", "부츠", "샌들", "슬리퍼", "숄더백", "크로스백", "토트백", "백팩", "에코백", "클러치"], "fits": []}
