    },
    {
      "name": "invalid_enum_is_rejected_with_field",
      "ac": ["AC1"],
      "feature": "api_errors",
      "input": {"request": {"slot": "상의", "kind": "니트", "color": "검정", "visual_fit": "레귤러"}},
      "judge": {"type": "error_response", "status": 400, "code": "invalid_enum", "field": "color"},
      "pass_output": {"status": 400, "body": {"error": {"code": "invalid_enum", "message": "색 '검정'은 고를 수 있는 값이 아니에요", "field": "color"}}},
      "fail_output": {"status": 200, "body": {"wardrobe_item": {"id": "w-1", "slot": "상의", "kind": "니트", "color": "검정", "visual_fit": "레귤러"}}},
      "note": "목록에 없는 색('검정')으로 옷장 등록을 요청하면 저장하지 않고 400 invalid_enum과 틀린 칸 이름을 돌려줘야 한다."
    },
