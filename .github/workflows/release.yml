name: Approved release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment with required reviewers and scoped secrets
        required: true
        type: choice
        options:
          - staging
          - production
      expected_sha:
        description: Exact 40-character commit SHA approved for release
        required: true
        type: string
      apply_migrations:
        description: Apply pending migrations after dry-run
        required: true
        default: false
        type: boolean
      deploy_backend:
        description: Deploy Supabase Edge Function api
        required: true
        default: true
        type: boolean
      deploy_web:
        description: Deploy Expo web hosting
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: approved-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify immutable target
        id: target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$RELEASE_ENVIRONMENT" = "production" ]; then
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          fi
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify server and approved golden cases
        run: npm run check
      - name: Install locked mobile dependencies
        run: npm ci --prefix mobile
      - name: Verify mobile
        run: npm run check:mobile

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.target_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Require configured approval guard
        env:
          RELEASE_APPROVAL_GUARD: ${{ secrets.RELEASE_APPROVAL_GUARD }}
          EXPECTED_GUARD: ${{ inputs.environment }}-enabled
        run: test "$RELEASE_APPROVAL_GUARD" = "$EXPECTED_GUARD"
      - name: Install locked dependencies
        run: npm ci
      - name: Link isolated Supabase target
        if: inputs.apply_migrations || inputs.deploy_backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Review remote migrations and dry-run
        if: inputs.apply_migrations || inputs.deploy_backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase migration list --remote
          npx supabase db push --remote --dry-run --include-all
      - name: Apply approved migrations
        if: inputs.apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --remote --yes --include-all
      - name: Deploy Edge Function with release metadata
        if: inputs.deploy_backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TARGET_SHA: ${{ needs.verify.outputs.target_sha }}
        run: |
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "RELEASE_GIT_SHA=$TARGET_SHA" "RELEASED_AT=$RELEASED_AT"
          npx supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify backend release SHA
        if: inputs.deploy_backend
        env:
          RELEASE_HEALTH_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api/health
          EXPECTED_GIT_SHA: ${{ needs.verify.outputs.target_sha }}
        run: node scripts/verify-release.mjs
      - name: Install Expo dependencies
        if: inputs.deploy_web
        run: npm ci --prefix mobile
      - name: Export Expo web
        if: inputs.deploy_web
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          npx expo export --platform web
      - name: Deploy Expo web
        if: inputs.deploy_web
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$RELEASE_ENVIRONMENT" = "production" ]; then
            npx eas-cli@latest deploy --prod --non-interactive --json --export-dir dist
          else
            npx eas-cli@latest deploy --alias staging --non-interactive --json --export-dir dist
          fi
      - name: Write release summary
        env:
          TARGET_SHA: ${{ needs.verify.outputs.target_sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "## Approved release"
            echo "- Environment: $RELEASE_ENVIRONMENT"
            echo "- Git SHA: $TARGET_SHA"
            echo "- Migrations applied: ${{ inputs.apply_migrations }}"
            echo "- Backend deployed: ${{ inputs.deploy_backend }}"
            echo "- Expo web deployed: ${{ inputs.deploy_web }}"
          } >> "$GITHUB_STEP_SUMMARY"
