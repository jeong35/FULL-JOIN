name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run agent and test harness checks
        run: npm run check
      - name: Install locked mobile dependencies
        run: npm ci --prefix mobile
      - name: Run mobile type and lint checks
        run: npm run check:mobile
