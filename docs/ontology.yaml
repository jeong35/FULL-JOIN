# FULL JOIN 미니 온톨로지 — 추구미 앱
#
# 규칙
#   1. evidence: 는 docs/research/interviews.md B절의 로그 번호(관찰은 '관찰 N').
#      근거로 역추적되지 않는 항목은 두지 않는다.
#   2. relations의 대상은 반드시 이 파일에 정의된 클래스여야 한다.
#   3. 클래스는 로그에서 반복된 명사, 관계는 반복된 동사에서만 온다.
#   4. examples: 의 값은 인터뷰이가 쓴 말을 그대로 쓴다.
#   5. '(가설 반응 — 근거 제외)' 표시된 답변과 Q10 요청(참고)은 evidence로 쓰지 않는다.
#
# 어휘 추출 (로그 → 후보)
#   반복된 명사: 저장한 사진·캡처·캡쳐본·게시물 / 옷·바지·셔츠·코트·신발 / 제품·상품 /
#                집에 있는 옷·가지고 있는 옷 / 무신사·에이블리·공홈 / 무드 / 헤어·메이크업
#   반복된 동사: 저장한다·캡처한다 / 다시 찾아본다 / (똑같은 것·비슷한 것을) 찾는다 /
#                (집에 있는 옷이랑) 어울릴지 생각한다·매칭한다 / 산다·따라 한다
#   동의어 통합:
#     '저장한 사진' = '캡처' = '캡쳐본' = '저장해 둔 게시물' → 대표어 StyleImage
#     '집에 있는 옷' = '가지고 있는 옷' = '기존에 있는 옷'  → 대표어 WardrobeItem
#     '제품' = '상품' = '(쇼핑몰의) 옷'                     → 대표어 Product
#     '사진 속 그 옷' = '사진 속 아이템'                     → 대표어 Item
#     '코디' = '매치' = '조합' = '같이 입을 옷'               → 대표어 Outfit
#
# v0 → v1 변경 (v0는 인터뷰 전 후보. git 이력 참조)
#   삭제: PersonalProfile, Occasion, Constraint, Look, RequestContext, Recommendation, Rationale
#         — 이번 로그에서 반복되지 않았거나(체형·진단·자리), 인터뷰 대상이 아닌 개념(대화 요청).
#         강의 3 파싱 대상은 사진(StyleImage → Item)으로 정했다(src/fulljoin/schemas/style_image.schema.json).
#         RequestContext(챗봇 질문)는 챗봇 범위가 확정되면 다시 검토한다.
#   이름 변경: AspiredStyle → StyleImage (사람들은 '추구미'를 개념이 아니라 '저장한 사진'으로 말했다)
#   추가: Product, WardrobeItem, User, Outfit(갭 분석 결과의 코디 조합)

version: 1

classes:

  User:
    description: 스타일 사진을 저장하고, 그 스타일을 실제로 사거나 따라 하려는 사람
    evidence: [로그 1, 로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8]
    attributes:
      id: {type: string, key: true}
      shopping_apps: {type: list, examples: [무신사, 에이블리, 지그재그, 공홈, 크림, 올리브영], evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 9, 로그 10]}
    relations:
      - saves: StyleImage
        evidence: [로그 1, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8]
      - owns: WardrobeItem
        evidence: [로그 1, 로그 2, 로그 5, 로그 6, 로그 8]

  StyleImage:
    description: 사용자가 되고 싶은 스타일(추구미)로 저장한 사진 한 장. 사용자에게는 '추구미' = 이 사진들의 모음이다.
    evidence: [로그 1, 로그 3, 로그 4, 로그 5, 로그 6, 로그 7, 로그 8]
    attributes:
      id: {type: string, key: true}
      style:
        type: list
        values: [캐주얼, 미니멀, 러블리, 청순, 엘레강스, 시크, 스트릿, 레트로, 프레피, 스포티, 글램]
        evidence: [로그 5, 로그 7, 로그 10]
        note: "사진 전체 코디의 분위기, 0~2개. 사용자는 옷 하나하나보다 무드를 먼저 본다 — '무드가 괜찮아야 이제 제품을 본다'(로그 5), '그 옷의 하나하나보다 무드가 굉장히 중요해서'(로그 10), 무드 참고형(로그 7). 인터뷰에 구체적인 스타일 단어가 거의 없어 단어 목록은 지그재그 스타일 필터(10/12 캡처)에서 가져오고 청순은 팀 결정으로 더했다. 예전의 사진 종류 분류(코디/무드·헤어·메이크업)는 피드 전환과 함께 없앴다(10/12) — 피드 사진은 모두 코디 사진이다"
      source:
        type: enum
        values: [쇼핑몰, 인플루언서, 연예인, 자체_촬영]
        evidence: [팀 결정 10/12]
        note: "앱이 피드로 올리는 사진의 출처. 사용자에게 사진을 받지 않는다. 자체_촬영은 쇼핑몰·인플루언서 허락을 못 받았을 때 팀이 직접 찍은 사진. 인터뷰에서 사진이 인스타·캡처·DM·핀터레스트에 흩어져 있던 것(로그 1, 3~8 — 페인 2 재탐색)은 앱 안 한곳에 모으는 근거"
      saved_at: {type: date, evidence: [로그 1, 로그 7, 로그 8]}
    relations:
      - contains: Item
        evidence: [로그 1, 로그 2, 로그 4, 로그 5]

  Item:
    description: StyleImage 안에 보이는 개별 옷 아이템(상의·하의·아우터·신발·가방). 찾고 맞춰 보는 단위. 헤어·메이크업은 다루지 않는다(SPEC 4절).
    evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 8]
    attributes:
      slot: {type: enum, values: [상의, 하의, 원피스, 아우터, 신발, 가방], evidence: [로그 1, 로그 2, 로그 5, 로그 9, 로그 10], note: "부위. 매칭은 부위 단위로 한다 — '바지를 중심으로 위를'(로그 2), '하의 위주로'(로그 9). 원피스는 인터뷰 근거가 없다 — 사진에 원피스가 나오면 담을 칸이 없어 '옷을 찾지 못했어요'라는 틀린 답이 나오므로 넣은 팀 결정(10/12). 원피스는 상의·하의 자리를 한 벌로 채운다"}
      kind: {type: string, examples: [트렌치코트, 블라우스 셔츠, 신발, 니트, 레더자켓], evidence: [로그 1, 로그 2, 로그 4, 로그 5, 로그 8]}
      color: {type: string, examples: [소라색], evidence: [로그 2]}
      visual_fit: {type: string, examples: [레귤러핏, 부해 보임, 통이 넓음], evidence: [로그 1, 로그 3, 로그 7, 로그 8, 로그 10], note: "방치 이유의 주요 축(페인 4)"}
      visibility: {type: enum, values: [전체, 일부, 판단불가], evidence: [팀 결정 10/13], note: "사진에 보이는 정도. 보이지 않는 하의를 지어내는 오류(parse_query 실패 모드 2)를 구분하려고 둔다"}
      gap_status:
        type: enum
        values: [활용, 비슷함, 구매]
        evidence: [로그 3, 로그 6, 로그 7, 로그 9]
        note: "갭 분석 결과(SPEC AC9). 같은 부위·종류에 같은 색이면 활용, 같은 계열 색만 있으면 비슷함, 없으면 구매 — '제 옷장에 있는 걸 최대한 찾아서 … 입고 싶은 옷이 있으면 그냥 비슷한 옷으로'(로그 9). 모델이 아니라 갭 분석 코드가 채운다"
      brand: {type: string, nullable: true, evidence: [로그 3, 로그 6], note: "캡션·이미지 속 글자에 적혀 있을 때만 채운다(SPEC AC2) — '브랜드가 보이면 공홈 구매'(로그 3 대상), '정보가 있으면 캡처를 해놓거나'(로그 6)"}
      product_name: {type: string, nullable: true, evidence: [로그 3, 로그 4, 로그 6], note: "근거가 없으면 null(SPEC AC2)"}
      brand_source:
        type: enum
        values: [캡션, 이미지_글자, 쇼핑몰_상품정보, 사용자_입력, 없음]
        # 모델 출력 스키마에는 캡션·이미지_글자·없음만 있다. 쇼핑몰_상품정보·사용자_입력은 앱 데이터 계층에서 채운다(10/13)
        evidence: [로그 4, 로그 6, 로그 10]
        note: "정보가 있는지가 저장·탐색 행동을 가른다 — '정보가 안 나와 있어도 일단 저장'(로그 4), '작성자가 정보가 없어요 하면 그냥 포기'(로그 6), '어디서 저장했는지 모르겠는 사진이 많아서'(로그 10)"
    note: |
      kind·color·fit의 examples는 인터뷰이가 쓴 말 그대로다. 출력 스키마(강의 3, src/fulljoin/schemas/style_image.schema.json)에서는
      이 속성들을 닫힌 목록(enum)으로 정의하고, 인터뷰 표현은 그 목록 값으로 매핑한다(SPEC AC1).
      목록의 근거와 매핑표는 src/fulljoin/prompts/parse_query.md "보기 목록과 근거"에 있다(무신사·에이블리·지그재그 중 두 곳 이상이 쓰는 이름).
    relations:
      - found_as: Product
        evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 7, 로그 8, 로그 9, 로그 10]
      - pairs_with: WardrobeItem
        evidence: [로그 1, 로그 2, 로그 5, 로그 6, 로그 8, 로그 9, 로그 10]

  Product:
    description: 쇼핑 플랫폼에서 살 수 있는 상품. Item과 똑같은 것일 수도, 비슷한 것일 수도 있다.
    evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 7, 로그 8]
    attributes:
      platform: {type: string, examples: [무신사, 에이블리, 공홈, 크림], evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 7]}
      match_type:
        type: enum
        values: [exact, similar]
        evidence: [로그 2, 로그 3, 로그 4, 로그 5, 로그 7, 로그 8]
        note: "exact 선호(로그 3, 4, 5, 8) vs similar(로그 2, 7). similar를 '같은 상품'처럼 표시하면 안 된다"
      url: {type: string, evidence: [로그 3, 로그 6], note: "링크를 타고 들어가 사는 행동에서 나옴. 상품 사진은 저장하지 않고 링크만 둔다"}
    relations:
      - matches: Item
        evidence: [로그 2, 로그 7, 로그 8]

  WardrobeItem:
    description: 사용자가 이미 가지고 있는 옷. 구매 전 '어울릴지'를 판단하는 기준.
    evidence: [로그 1, 로그 2, 로그 3, 로그 5, 로그 6, 로그 7, 로그 8, 로그 9, 로그 10]
    attributes:
      slot: {type: enum, values: [상의, 하의, 원피스, 아우터, 신발, 가방], evidence: [로그 1, 로그 2, 로그 5, 로그 9, 로그 10], note: "Item.slot과 같은 목록"}
      kind: {type: string, examples: [바지, 청바지, 탑, 아우터], evidence: [로그 1, 로그 2, 로그 5, 로그 6, 로그 9, 로그 10]}
      color: {type: string, examples: [검은색, 청], evidence: [로그 6, 로그 10], note: "'검은색 바지를 주로 입으니까 위에는 좀 밝은 색'(로그 6)"}
      visual_fit: {type: string, evidence: [로그 8], note: "'이런 핏이면 내가 가지고 있는 옷이랑 좀 잘 맞겠는데'(로그 8)"}
    relations:
      - owned_by: User
        evidence: [로그 1, 로그 8]
    note: |
      매칭 고민은 10명 모두에게 있었다(페인 3). 입력 방식은 칩 선택(부위·종류·색·핏, 사진 선택 — SPEC 4절).
      '옷장 등록 의향'은 가정 질문(Q11)으로만 물어서 근거가 없다. 칩이 등록 부담을 줄인다는 것은 가설이다.
      slot·kind·color·fit은 Item과 같은 enum을 쓴다 — 같은 목록이어야 대조할 수 있다(SPEC AC1).

  Outfit:
    description: 함께 입는 옷의 조합(코디). 갭 분석에서 가진 옷(WardrobeItem)과 사진 속 아이템(Item)을 부위별로 채운 결과.
    evidence: [로그 2, 로그 3, 로그 9, 로그 10]
    relations:
      - includes: WardrobeItem
        evidence: [로그 2, 로그 9, 로그 10]
      - includes: Item
        evidence: [로그 3, 로그 10]
    note: |
      '이 가격을 주고 제가 다른 옷들과 또 얼마나 코디를 할 수 있는 옷인지'(로그 9), '무조건 하의 두 개씩은 매치해 본 것 같습니다'(로그 10).
      Look(v0)은 '한 자리를 위한 옷·화장 묶음'이었고 근거가 없어 삭제했다. Outfit은 옷끼리의 조합만 뜻한다.

# 범위 밖(명시): 결제·앱 내 구매 / 헤어·메이크업 태깅·분석 / 미용실 예약·시술 결과 예측 / 네일 / 스킨케어·이너뷰티 /
#                얼굴로 인물 식별 / 가상 피팅·이미지 생성 / 쇼핑몰 상품 사진 저장(링크만)
#
# 근거 부족으로 이번에 넣지 않은 것 (근거가 더 생기면 다시 검토):
#   - 헤어·메이크업 '따라 하는 방법'(튜토리얼) — 로그 6의 '유튜브 룩북' 1건뿐
#   - 체형·퍼스널 컬러 진단 — 로그 8의 '퍼스널 컬러 추천 화장품' 1건뿐
#   - 날씨·TPO — 로그 5의 요청(참고)뿐
#
# 핵심 흐름 (갭 분석):
#   User --(saves)--> StyleImage --(contains)--> Item --(pairs_with)--> WardrobeItem   [gap_status = 활용]
#                                                  └--(found_as)--> Product          [gap_status = 구매]
#   Outfit --(includes)--> WardrobeItem + Item
