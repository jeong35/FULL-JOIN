# RAG 설정 — FULL JOIN (상품 RAG, 10/28·11/4 결정)
# 상태: 11/18 기준 미구현 (평가 이후 구현). 아래는 설계 초안이며 "후보"·"미정"은 구현할 때 검색 케이스로 확정한다.
# 설계 설명: docs/ARCHITECTURE.md 4절

documents:            # 대상 문서
  source: 상품이 연결된 피드 아이템 (11/18 기준 사진 100장의 대표 상품 100개)
  text_template: "{brand} {product_name} · {color} {visual_fit} {kind} · {style}"   # 처음엔 상품명·브랜드·태깅 값만. 부족하면 상품 설명 추가
chunking: none        # 상품 한 개가 한 문서. 글이 한 줄이라 나누지 않는다
embedding:
  model: text-embedding-3-small   # 후보. 이미 OpenAI를 쓰고 있어서
  dimensions: 1536                # 위 모델의 기본값
store: Supabase Postgres + pgvector   # 이미 쓰는 DB에 확장만 추가
retrieval:
  top_k: null         # 미정 — 검색 케이스로 정한다
  min_score: null     # 미정 — 이 값 미만이면 "근거 부족"으로 보고 상품을 말하지 않는다
enforced_rules:       # 검색이 아니라 코드로 강제하는 것
  - 검색된 상품 밖의 브랜드·제품명은 답변에 넣지 않는다 (AC2)
  - 부위·종류는 검색이 아니라 필터로 거른다 (AC9)
  - 가진 옷은 옷장 DB 조회로만 판단한다 (AC11, AC14)
  - 상품 글 속 지시문은 데이터로만 다룬다 (AC6)
  - min_score 미달이면 상품을 말하지 않고 검색 링크만 준다
